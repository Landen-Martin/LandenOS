<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandenOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        html, body {
            background: #000;
            color: #aaa;
            font-family: 'VT323', monospace;
            font-size: 2.2vw;
            line-height: 1;
            margin: 0;
            padding: 8px;
            height: 100vh;
            box-sizing: border-box;
            user-select: none;
            letter-spacing: 0.05vw;
            overflow: hidden;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeSpeed;
        }

        #terminal {
            height: 100%;
            overflow: hidden;
        }

        #terminal div {
            margin: 0;
            padding: 0;
            line-height: 1;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .tag-noats {
            color: #5599ff;
            font-weight: bold;
        }

        .tag-warng {
            color: #ffff55;
            font-weight: bold;
        }

        .tag-error {
            color: #ff5555;
            font-weight: bold;
        }

        .cursor {
            display: inline-block;
            width: 0.5em;
            height: 0.15em;
            background: #aaa;
            vertical-align: bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div>Welcome to LandenOS!</div>
        <div>Type `help` for help</div>
        <div class="line">&gt;&gt;&gt; <span class="input"></span><span class="cursor"></span></div>
    </div>

    <script>
        let buffer = '';
        const MAX_INPUT = 76;
        const terminal = document.getElementById('terminal');

        function createLineElement(text) {
            const line = document.createElement('div');
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            escaped = escaped
                .replace(/\[noats\]/g, '<span class="tag-noats">[noats]</span>')
                .replace(/\[warng\]/g, '<span class="tag-warng">[warng]</span>')
                .replace(/\[error\]/g, '<span class="tag-error">[error]</span>');

            line.innerHTML = escaped;
            return line;
        }

        const OS = {
            version: "alpha v1.0.2",
            sysInfo: "LandenOS v1.0.0 | x86_64 Virtual Engine | 640KB Base RAM / 16MB Total | VGA Display 80x25",
            isPoweredOn: true,

            executeSingle(input, pipedData = null) {
                if (!this.isPoweredOn) return null;
                const raw = input.trim();
                if (!raw) return [];

                const spaceIndex = raw.indexOf(' ');
                let cmd = raw;
                let args = '';

                if (spaceIndex !== -1) {
                    cmd = raw.substring(0, spaceIndex);
                    args = raw.substring(spaceIndex + 1).trim();
                }

                // HELP
                if (cmd === 'help') {
                    if (!args) {
                        return [
                            'LandenOS Command List:',
                            '  help        - Display available system commands',
                            '  cleans      - Clear terminal screen output',
                            '  echo `text` - Print text to screen',
                            '  time        - Display Unix timestamp or formatted date/time',
                            '  test        - Run system diagnostic tests',
                            '  boot        - Control system power and reboot state',
                            '  sys         - Display full system information or version'
                        ];
                    }
                    if (args === '-h') {
                        return ['help - Displays help menu or flag info. Usage: help [-f|-h] or help `cmd` [-f|-h]'];
                    }
                    if (args === '-f') {
                        return [
                            'LandenOS Help Flags:',
                            '  -f - List available help flags',
                            '  -h - Display help for the help command'
                        ];
                    }
                    if (args === '-v') {
                        return ['[warng] Flag `-v` moved to `sys -v`! Use `sys -v` for version.'];
                    }
                    if (args.startsWith('`')) {
                        const closingIndex = args.indexOf('`', 1);
                        if (closingIndex === -1) {
                            return [`[error] Syntax error in \`${cmd}\`: Target command must be enclosed in backticks (\`cmd\`).`];
                        }
                        const targetCmd = args.substring(1, closingIndex).trim();
                        const flag = args.substring(closingIndex + 1).trim();

                        const validCommands = ['help', 'cleans', 'echo', 'time', 'test', 'boot', 'sys'];
                        if (!validCommands.includes(targetCmd)) {
                            return [`[error] \`${targetCmd}\` is not a command!`];
                        }

                        if (!flag || flag === '-h') {
                            if (targetCmd === 'help') return ['help - Display system commands and flags. Usage: help [-f|-h] or help `cmd` [-f|-h]'];
                            if (targetCmd === 'cleans') return ['cleans - Clears all terminal screen output. Usage: cleans [-h]'];
                            if (targetCmd === 'echo') return ['echo - Outputs text or processes piped input. Usage: echo `text` [-h]'];
                            if (targetCmd === 'time') return ['time - Displays Unix timestamp, date, or time. Usage: time [-r|-t|-d|-h]'];
                            if (targetCmd === 'test') return ['test - Diagnostics runner for system hardware. Usage: test [-c|-s|-r|-v|-h]'];
                            if (targetCmd === 'boot') return ['boot - Controls computer power and system state. Usage: boot [-r|-t|-h]'];
                            if (targetCmd === 'sys') return ['sys - Displays system info and OS version variable. Usage: sys [-v|-h]'];
                        } else if (flag === '-f') {
                            if (targetCmd === 'help') return ['Flags for `help`:', '  -f - List flags', '  -h - Command help'];
                            if (targetCmd === 'cleans') return ['Flags for `cleans`:', '  -h - Command help'];
                            if (targetCmd === 'echo') return ['Flags for `echo`:', '  -h - Command help'];
                            if (targetCmd === 'time') return ['Flags for `time`:', '  -r - Readable time/date', '  -t - Time only', '  -d - Date only', '  -h - Command help'];
                            if (targetCmd === 'test') return ['Flags for `test`:', '  -c - Color test', '  -s - System test', '  -r - RAM test', '  -v - VRAM test', '  -h - Command help'];
                            if (targetCmd === 'boot') return ['Flags for `boot`:', '  -r - Reboot system', '  -t - Reboot and test', '  -h - Command help'];
                            if (targetCmd === 'sys') return ['Flags for `sys`:', '  -v - Display OS version variable', '  -h - Command help'];
                        } else {
                            return [`[error] Unknown flag \`${flag}\` for \`help \`${targetCmd}\`\`!`];
                        }
                    }
                    if (args.startsWith('-')) {
                        return [`[error] Unknown flag \`${args}\` for \`help\`!`];
                    }
                    return [`[error] The command \`${cmd}\` received invalid arguments!`];
                }

                // CLEANS
                if (cmd === 'cleans') {
                    if (args === '-h') {
                        return ['cleans - Clears all output from the terminal screen. Flags: -h'];
                    }
                    if (args) {
                        return [`[error] The command \`${cmd}\` received too many arguments!`];
                    }
                    terminal.innerHTML = '';
                    return null;
                }

                // ECHO
                if (cmd === 'echo') {
                    if (args === '-h') {
                        return ['echo - Print text enclosed in backticks or receive piped data. Flags: -h'];
                    }
                    if (!args) {
                        if (pipedData !== null && pipedData.length > 0) {
                            return pipedData;
                        }
                        return [`[error] The command \`${cmd}\` requiters more arguments then you inputed!`];
                    }
                    if (args.startsWith('`')) {
                        const closingIndex = args.indexOf('`', 1);
                        if (closingIndex === -1) {
                            return [`[error] Syntax error in \`${cmd}\`: String arguments must be enclosed in backticks (\`text\`).`];
                        }
                        const rest = args.substring(closingIndex + 1).trim();
                        if (rest.length > 0) {
                            return [`[error] The command \`${cmd}\` received too many arguments!`];
                        }
                        return [args.substring(1, closingIndex)];
                    }
                    return [`[error] Syntax error in \`${cmd}\`: String arguments must be enclosed in backticks (\`text\`).`];
                }

                // TIME
                if (cmd === 'time') {
                    if (!args) {
                        return [`${Math.floor(Date.now() / 1000)}`];
                    }
                    if (args === '-r') {
                        return [`${new Date().toLocaleString()}`];
                    }
                    if (args === '-t') {
                        return [`${new Date().toLocaleTimeString()}`];
                    }
                    if (args === '-d') {
                        return [`${new Date().toLocaleDateString()}`];
                    }
                    if (args === '-h') {
                        return ['time - Outputs current Unix timestamp or formatted date/time. Flags: -r (readable), -t (time only), -d (date only), -h (help)'];
                    }
                    return [`[error] Unknown flag \`${args}\` for \`${cmd}\`!`];
                }

                // TEST
                if (cmd === 'test') {
                    if (!args) {
                        return [
                            '[noats] RUNNING ALL SYSTEM TESTS...',
                            '[test] COLOR: OK (VGA 16-color pass)',
                            '[test] SYSTEM: OK (CPU & System Clock pass)',
                            '[test] RAM: OK (640KB Base / 16MB Ext pass)',
                            '[test] VRAM: OK (256KB Video Memory pass)',
                            '[noats] ALL TESTS COMPLETED SUCCESSFULLY.'
                        ];
                    }
                    if (args === '-c') {
                        return ['[test] COLOR: OK (VGA 16-color pass)'];
                    }
                    if (args === '-s') {
                        return ['[test] SYSTEM: OK (CPU & System Clock pass)'];
                    }
                    if (args === '-r') {
                        return ['[test] RAM: OK (640KB Base / 16MB Ext pass)'];
                    }
                    if (args === '-v') {
                        return ['[test] VRAM: OK (256KB Video Memory pass)'];
                    }
                    if (args === '-h') {
                        return ['test - Diagnostic tests for hardware. Flags: -c (color), -s (system), -r (RAM), -v (VRAM), -h (help)'];
                    }
                    return [`[error] Unknown flag \`${args}\` for \`${cmd}\`!`];
                }

                // BOOT
                if (cmd === 'boot') {
                    if (!args) {
                        terminal.innerHTML = '';
                        terminal.appendChild(createLineElement('[noats] [SYSTEM SHUTDOWN - POWER OFF]'));
                        this.isPoweredOn = false;
                        return null;
                    }
                    if (args === '-r') {
                        terminal.innerHTML = '<div>Welcome to LandenOS!</div><div>Type `help` for help</div>';
                        return null;
                    }
                    if (args === '-t') {
                        terminal.innerHTML = '<div>Welcome to LandenOS!</div><div>Type `help` for help</div>';
                        return this.executeSingle('test');
                    }
                    if (args === '-h') {
                        return ['boot - System power management. Flags: (none) turn off, -r (reboot), -t (reboot and test), -h (help)'];
                    }
                    return [`[error] Unknown flag \`${args}\` for \`${cmd}\`!`];
                }

                // SYS
                if (cmd === 'sys') {
                    if (!args) {
                        return [
                            '--- LandenOS System Information ---',
                            `Version     : ${this.version}`,
                            `System      : ${this.sysInfo}`,
                            `System Time : ${new Date().toLocaleString()}`,
                            'State       : RUNNING (OK)'
                        ];
                    }
                    if (args === '-v') {
                        return [`LandenOS Version: ${this.version}`];
                    }
                    if (args === '-h') {
                        return ['sys - Displays system information or OS version. Flags: -v (version), -h (help)'];
                    }
                    return [`[error] Unknown flag \`${args}\` for \`${cmd}\`!`];
                }

                return [`[error] \`${cmd}\` is not a command! Type \`help\` for a list of commands.`];
            },

            executePipeline(pipelineStr) {
                const pipeCmds = [];
                let current = '';
                let inBacktick = false;

                for (let i = 0; i < pipelineStr.length; i++) {
                    const char = pipelineStr[i];
                    if (char === '`') {
                        inBacktick = !inBacktick;
                        current += char;
                    } else if (!inBacktick && char === '|') {
                        pipeCmds.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                pipeCmds.push(current);

                let currentOutput = null;

                for (const cmdStr of pipeCmds) {
                    if (!cmdStr.trim()) continue;
                    currentOutput = this.executeSingle(cmdStr, currentOutput);
                    if (currentOutput === null) {
                        break;
                    }
                    if (currentOutput.length > 0 && typeof currentOutput[0] === 'string' && currentOutput[0].startsWith('[error]')) {
                        break;
                    }
                }

                return currentOutput;
            },

            execute(input) {
                if (!this.isPoweredOn) return null;

                // Check for unsupported double-symbol operators outside backticks
                let checkBacktick = false;
                for (let i = 0; i < input.length - 1; i++) {
                    const char = input[i];
                    if (char === '`') {
                        checkBacktick = !checkBacktick;
                    } else if (!checkBacktick) {
                        const nextChar = input[i + 1];
                        if (char === nextChar && /[^\w\s`]/.test(char)) {
                            if (char !== '&') {
                                const badOp = char + nextChar;
                                return [`[error] Unsupported command operator \`${badOp}\`! Use \`&&\` to chain commands.`];
                            }
                        }
                    }
                }

                const rawCommands = [];
                let current = '';
                let inBacktick = false;

                for (let i = 0; i < input.length; i++) {
                    const char = input[i];
                    if (char === '`') {
                        inBacktick = !inBacktick;
                        current += char;
                    } else if (!inBacktick && char === '&' && input[i + 1] === '&') {
                        rawCommands.push(current);
                        current = '';
                        i++;
                    } else {
                        current += char;
                    }
                }
                rawCommands.push(current);

                let combinedOutput = [];
                let isCleared = false;

                for (const cmdStr of rawCommands) {
                    if (!cmdStr.trim()) continue;
                    const output = this.executePipeline(cmdStr);
                    if (output === null) {
                        combinedOutput = [];
                        isCleared = true;
                    } else {
                        combinedOutput.push(...output);
                    }
                }

                if (isCleared && combinedOutput.length === 0) {
                    return null;
                }
                return combinedOutput;
            }
        };

        function scrollToBottom() {
            terminal.scrollTop = terminal.scrollHeight;
        }

        window.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        window.addEventListener('click', () => {
            if (!document.pointerLockElement && OS.isPoweredOn) {
                document.body.requestPointerLock();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (!OS.isPoweredOn) return;

            if (document.pointerLockElement === document.body) {
                if (e.key === 'Escape') {
                    document.exitPointerLock();
                    return;
                }

                e.preventDefault();
                e.stopPropagation();

                const activeLine = terminal.lastElementChild;
                if (!activeLine || !activeLine.classList.contains('line')) return;

                const inputSpan = activeLine.querySelector('.input');
                const cursor = activeLine.querySelector('.cursor');

                if (e.key === 'Enter') {
                    if (cursor) cursor.remove();
                    
                    const output = OS.execute(buffer);
                    if (output !== null && OS.isPoweredOn) {
                        output.forEach(text => {
                            const line = createLineElement(text);
                            terminal.appendChild(line);
                        });
                    }

                    if (OS.isPoweredOn) {
                        const nextLine = document.createElement('div');
                        nextLine.className = 'line';
                        nextLine.innerHTML = '&gt;&gt;&gt; <span class="input"></span><span class="cursor"></span>';
                        terminal.appendChild(nextLine);
                    }

                    buffer = '';
                    scrollToBottom();
                } else if (e.key === 'Backspace') {
                    buffer = buffer.slice(0, -1);
                    if (inputSpan) inputSpan.textContent = buffer;
                    scrollToBottom();
                } else if (e.key.length === 1) {
                    if (buffer.length < MAX_INPUT) {
                        buffer += e.key;
                        if (inputSpan) inputSpan.textContent = buffer;
                        scrollToBottom();
                    }
                }
            }
        }, true);
    </script>
</body>
</html>
