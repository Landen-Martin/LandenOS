<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandenOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        html, body {
            background: #000;
            color: #aaa;
            font-family: 'VT323', monospace;
            font-size: 2.2vw;
            line-height: 1;
            margin: 0;
            padding: 8px;
            height: 100vh;
            box-sizing: border-box;
            user-select: none;
            letter-spacing: 0.05vw;
            overflow: hidden;
            -webkit-font-smoothing: none;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeSpeed;
        }

        #terminal {
            height: 100%;
            overflow: hidden;
        }

        #terminal div {
            margin: 0;
            padding: 0;
            line-height: 1;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .tag-noats {
            color: #5599ff;
            font-weight: bold;
        }

        .tag-warng {
            color: #ffff55;
            font-weight: bold;
        }

        .tag-error {
            color: #ff5555;
            font-weight: bold;
        }

        .cursor {
            display: inline-block;
            width: 0.5em;
            height: 0.15em;
            background: #aaa;
            vertical-align: bottom;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div id="terminal">
        <div>Welcome to LandenOS!</div>
        <div>Type `help` for help</div>
        <div class="line">&gt;&gt;&gt; [user @ /] $ <span class="input"></span><span class="cursor"></span></div>
    </div>

    <script>
        let buffer = '';
        const MAX_INPUT = 76;
        const terminal = document.getElementById('terminal');

        function stripQuotes(str) {
            if (!str) return '';
            let s = str.trim();
            while ((s.startsWith('`') && s.endsWith('`')) ||
                   (s.startsWith("'") && s.endsWith("'")) ||
                   (s.startsWith('"') && s.endsWith('"'))) {
                s = s.slice(1, -1).trim();
            }
            if (s.startsWith('`') || s.startsWith("'") || s.startsWith('"')) s = s.slice(1);
            if (s.endsWith('`') || s.endsWith("'") || s.endsWith('"')) s = s.slice(0, -1);
            return s.trim();
        }

        function matchWildcard(str, pattern) {
            const regexPattern = '^' + pattern.replace(/\./g, '\\.').replace(/\*/g, '.*').replace(/\?/g, '.') + '$';
            return new RegExp(regexPattern).test(str);
        }

        function createLineElement(text) {
            const line = document.createElement('div');
            let escaped = text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");

            escaped = escaped
                .replace(/\[noats\]/g, '<span class="tag-noats">[noats]</span>')
                .replace(/\[warng\]/g, '<span class="tag-warng">[warng]</span>')
                .replace(/\[error\]/g, '<span class="tag-error">[error]</span>');

            line.innerHTML = escaped;
            return line;
        }

        const FS = {
            STORAGE_KEY: 'landenos_fs',

            init() {
                if (!localStorage.getItem(this.STORAGE_KEY)) {
                    const defaultFS = {
                        '/': { type: 'dir', created: Date.now() },
                        '/home': { type: 'dir', created: Date.now() },
                        '/readme.txt': { type: 'file', content: 'Welcome to LandenOS Virtual File System!', created: Date.now() }
                    };
                    this.save(defaultFS);
                }
            },

            getFS() {
                try {
                    return JSON.parse(localStorage.getItem(this.STORAGE_KEY)) || {};
                } catch (e) {
                    return {};
                }
            },

            save(fsData) {
                localStorage.setItem(this.STORAGE_KEY, JSON.stringify(fsData));
            },

            normalizePath(path, cwd) {
                if (!path) return cwd;
                let rawPath = stripQuotes(path);
                if (!rawPath) return cwd;

                let absolutePath;
                if (rawPath.startsWith('/')) {
                    absolutePath = rawPath;
                } else {
                    absolutePath = (cwd === '/' ? '' : cwd) + '/' + rawPath;
                }

                const parts = absolutePath.split('/').filter(Boolean);
                const stack = [];

                for (const part of parts) {
                    if (part === '.') {
                        continue;
                    } else if (part === '..') {
                        if (stack.length > 0) stack.pop();
                    } else {
                        stack.push(part);
                    }
                }

                const finalPath = '/' + stack.join('/');
                const fs = this.getFS();

                if (!fs[finalPath] && stack.length > 0) {
                    const rootCandidate = '/' + stack[stack.length - 1];
                    if (fs[rootCandidate]) return rootCandidate;
                }

                return finalPath;
            },

            getParentPath(path) {
                if (path === '/') return '/';
                const parts = path.split('/').filter(Boolean);
                parts.pop();
                return '/' + parts.join('/');
            },

            getNode(path) {
                const fs = this.getFS();
                return fs[path] || null;
            },

            exists(path) {
                return !!this.getNode(path);
            },

            createFile(path, content = '') {
                const fs = this.getFS();
                const parent = this.getParentPath(path);
                if (parent !== '/' && (!fs[parent] || fs[parent].type !== 'dir')) {
                    return false;
                }
                fs[path] = {
                    type: 'file',
                    content: content,
                    created: Date.now()
                };
                this.save(fs);
                return true;
            },

            createDir(path) {
                const fs = this.getFS();
                const parent = this.getParentPath(path);
                if (parent !== '/' && (!fs[parent] || fs[parent].type !== 'dir')) {
                    return false;
                }
                fs[path] = {
                    type: 'dir',
                    created: Date.now()
                };
                this.save(fs);
                return true;
            },

            remove(path) {
                const fs = this.getFS();
                if (!fs[path]) return false;

                if (fs[path].type === 'dir') {
                    const prefix = path === '/' ? '/' : path + '/';
                    for (const key in fs) {
                        if (key !== path && key.startsWith(prefix)) {
                            delete fs[key];
                        }
                    }
                }
                delete fs[path];
                this.save(fs);
                return true;
            },

            writeFile(path, content) {
                const fs = this.getFS();
                if (!fs[path] || fs[path].type !== 'file') return false;
                fs[path].content = content;
                fs[path].modified = Date.now();
                this.save(fs);
                return true;
            }
        };

        FS.init();

        function extractBackticks(str) {
            const result = [];
            let current = '';
            let inBacktick = false;

            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (char === '`') {
                    if (inBacktick) {
                        result.push(current);
                        current = '';
                        inBacktick = false;
                    } else {
                        inBacktick = true;
                    }
                } else if (inBacktick) {
                    current += char;
                }
            }
            return result;
        }

        function extractPathArgs(argsStr) {
            const ticks = extractBackticks(argsStr);
            if (ticks.length > 0) {
                return ticks.map(t => stripQuotes(t));
            }
            return argsStr.trim().split(/\s+/).map(s => stripQuotes(s)).filter(Boolean);
        }

        const OS = {
            version: "alpha v1.0.2.1790873943",
            sysInfo: "x86_64 Virtual Engine | 640KB Base RAM / 16MB Total | VGA Display 80x25",
            isPoweredOn: true,
            cwd: "/",
            clipboard: null,

            getPrompt() {
                return `>>> [user @ ${this.cwd}] $ `;
            },

            executeSingle(input, pipedData = null) {
                if (!this.isPoweredOn) return null;
                const raw = input.trim();
                if (!raw) return [];

                const spaceIndex = raw.indexOf(' ');
                let cmd = raw;
                let args = '';

                if (spaceIndex !== -1) {
                    cmd = raw.substring(0, spaceIndex);
                    args = raw.substring(spaceIndex + 1).trim();
                }

                // HELP
                if (cmd === 'help') {
                    if (!args) {
                        return [
                            'LandenOS Command List:',
                            '  help        - Display available system commands',
                            '  cleans      - Clear terminal screen output',
                            '  echo `text` - Print text to screen',
                            '  time        - Display Unix timestamp or formatted date/time',
                            '  test        - Run system diagnostic tests',
                            '  boot        - Control system power and reboot state',
                            '  sys         - Display full system information or version',
                            '  list        - List current directory contents',
                            '  file        - Inspect, create, or remove files',
                            '  dir         - Inspect, create, or remove directories',
                            '  iwf         - In/Write file contents',
                            '  mv          - Move, copy, paste, or duplicate files',
                            '  cd          - Change current working directory'
                        ];
                    }
                    if (args === '-h') {
                        return ['help - Displays help menu or flag info. Usage: help [-f|-h] or help `cmd` [-f|-h]'];
                    }
                    if (args === '-f') {
                        return [
                            'LandenOS Help Flags:',
                            '  -f - List available help flags',
                            '  -h - Display help for the help command'
                        ];
                    }
                    if (args === '-v') {
                        return ['[warng] Flag `-v` moved to `sys -v`! Use `sys -v` for version.'];
                    }
                    if (args.startsWith('`') || args.startsWith("'") || args.startsWith('"')) {
                        const targetCmd = stripQuotes(args.split(' ')[0]);
                        const flag = stripQuotes(args.substring(args.indexOf(' ') + 1));

                        const validCommands = ['help', 'cleans', 'echo', 'time', 'test', 'boot', 'sys', 'list', 'file', 'dir', 'iwf', 'mv', 'cd'];
                        if (!validCommands.includes(targetCmd)) {
                            return [`[error] \`${targetCmd}\` is not a command!`];
                        }

                        if (!flag || flag === '-h') {
                            if (targetCmd === 'help') return ['help - Display system commands and flags. Usage: help [-f|-h] or help `cmd` [-f|-h]'];
                            if (targetCmd === 'cleans') return ['cleans - Clears all terminal screen output. Usage: cleans [-h]'];
                            if (targetCmd === 'echo') return ['echo - Outputs text or processes piped input. Usage: echo `text` [-h]'];
                            if (targetCmd === 'time') return ['time - Displays Unix timestamp, date, or time. Usage: time [-r|-t|-d|-h]'];
                            if (targetCmd === 'test') return ['test - Diagnostics runner for system hardware. Usage: test [-c|-s|-r|-v|-h]'];
                            if (targetCmd === 'boot') return ['boot - Controls computer power and system state. Usage: boot [-r|-t|-h]'];
                            if (targetCmd === 'sys') return ['sys - Displays system info and OS version variable. Usage: sys [-v|-h]'];
                            if (targetCmd === 'list') return ['list - Lists current working directory. Usage: list [-r|-i|-t|-h]'];
                            if (targetCmd === 'file') return ['file - Inspect or manage files. Usage: file `path` [-f|-e|-r|-c|-h]'];
                            if (targetCmd === 'dir') return ['dir - Inspect or manage directories. Usage: dir `path` [-r|-c|-h]'];
                            if (targetCmd === 'iwf') return ['iwf - Read, write, or clear file contents. Usage: iwf [-r|-w|-c|-h] `path` [`content`]'];
                            if (targetCmd === 'mv') return ['mv - Move, copy, paste, or duplicate files. Usage: mv `src` `dest` | mv -c `path` | mv -p `path` | mv -d `src` `dest`'];
                            if (targetCmd === 'cd') return ['cd - Changes directory or goes back with `cd .`. Usage: cd `path` | cd . [-h]'];
                        } else if (flag === '-f') {
                            if (targetCmd === 'help') return ['Flags for `help`:', '  -f - List flags', '  -h - Command help'];
                            if (targetCmd === 'cleans') return ['Flags for `cleans`:', '  -h - Command help'];
                            if (targetCmd === 'echo') return ['Flags for `echo`:', '  -h - Command help'];
                            if (targetCmd === 'time') return ['Flags for `time`:', '  -r - Readable time/date', '  -t - Time only', '  -d - Date only', '  -h - Command help'];
                            if (targetCmd === 'test') return ['Flags for `test`:', '  -c - Color test', '  -s - System test', '  -r - RAM test', '  -v - VRAM test', '  -h - Command help'];
                            if (targetCmd === 'boot') return ['Flags for `boot`:', '  -r - Reboot system', '  -t - Reboot and test', '  -h - Command help'];
                            if (targetCmd === 'sys') return ['Flags for `sys`:', '  -v - Display OS version variable', '  -h - Command help'];
                            if (targetCmd === 'list') return ['Flags for `list`:', '  -r - Readable format', '  -i - Info (filesize)', '  -t - File tree view', '  -h - Command help'];
                            if (targetCmd === 'file') return ['Flags for `file`:', '  -f - Create or toggle remove', '  -e - Check existence', '  -r - Remove file (supports wildcards e.g. *.txt)', '  -c - Create file', '  -h - Command help'];
                            if (targetCmd === 'dir') return ['Flags for `dir`:', '  -r - Remove directory', '  -c - Create directory', '  -h - Command help'];
                            if (targetCmd === 'iwf') return ['Flags for `iwf`:', '  -r - Read contents', '  -w - Write content', '  -c - Clear content', '  -h - Command help'];
                            if (targetCmd === 'mv') return ['Flags for `mv`:', '  -c - Copy file to clipboard', '  -p - Paste file from clipboard', '  -d - Duplicate file to path', '  -h - Command help'];
                            if (targetCmd === 'cd') return ['Flags for `cd`:', '  -h - Command help'];
                        } else {
                            return [`[error] Unknown flag \`${flag}\` for \`help \`${targetCmd}\`\`!`];
                        }
                    }
                    if (args.startsWith('-')) {
                        return [`[error] Unknown flag \`${args}\` for \`help\`!`];
                    }
                    return [`[error] The command \`${cmd}\` received invalid arguments!`];
                }

                // CLEANS
                if (cmd === 'cleans') {
                    if (args === '-h') {
                        return ['cleans - Clears all output from the terminal screen. Flags: -h'];
                    }
                    if (args) {
                        return [`[error] The command \`${cmd}\` received too many arguments!`];
                    }
                    terminal.innerHTML = '';
                    return null;
                }

                // ECHO
                if (cmd === 'echo') {
                    if (args === '-h') {
                        return ['echo - Print text enclosed in backticks or receive piped data. Flags: -h'];
                    }
                    if (!args) {
                        if (pipedData !== null && pipedData.length > 0) {
                            return pipedData;
                        }
                        return [`[error] The command \`${cmd}\` requiters more arguments then you inputed!`];
                    }
                    return [stripQuotes(args)];
                }

                // TIME
                if (cmd === 'time') {
                    if (!args) {
                        return [`${Math.floor(Date.now() / 1000)}`];
                    }
                    if (args === '-r') {
                        return [`${new Date().toLocaleString()}`];
                    }
                    if (args === '-t') {
                        return [`${new Date().toLocaleTimeString()}`];
                    }
                    if (args === '-d') {
                        return [`${new Date().toLocaleDateString()}`];
                    }
                    if (args === '-h') {
                        return ['time - Outputs current Unix timestamp or formatted date/time. Flags: -r (readable), -t (time only), -d (date only), -h (help)'];
                    }
                    return [`[error] Unknown flag \`${args}\` for \`${cmd}\`!`];
                }

                // TEST
                if (cmd === 'test') {
                    if (!args) {
                        return [
                            '[noats] RUNNING ALL SYSTEM TESTS...',
                            '[test] COLOR: OK (VGA 16-color pass)',
                            '[test] SYSTEM: OK (CPU & System Clock pass)',
                            '[test] RAM: OK (640KB Base / 16MB Ext pass)',
                            '[test] VRAM: OK (256KB Video Memory pass)',
                            '[noats] ALL TESTS COMPLETED SUCCESSFULLY.'
                        ];
                    }
                    if (args === '-c') {
                        return ['[test] COLOR: OK (VGA 16-color pass)'];
                    }
                    if (args === '-s') {
                        return ['[test] SYSTEM: OK (CPU & System Clock pass)'];
                    }
                    if (args === '-r') {
                        return ['[test] RAM: OK (640KB Base / 16MB Ext pass)'];
                    }
                    if (args === '-v') {
                        return ['[test] VRAM: OK (256KB Video Memory pass)'];
                    }
                    if (args === '-h') {
                        return ['test - Diagnostic tests for hardware. Flags: -c (color), -s (system), -r (RAM), -v (VRAM), -h (help)'];
                    }
                    return [`[error] Unknown flag \`${args}\` for \`${cmd}\`!`];
                }

                // BOOT
                if (cmd === 'boot') {
                    if (!args) {
                        terminal.innerHTML = '';
                        terminal.appendChild(createLineElement('[noats] [SYSTEM SHUTDOWN - POWER OFF]'));
                        this.isPoweredOn = false;
                        return null;
                    }
                    if (args === '-r') {
                        terminal.innerHTML = '<div>Welcome to LandenOS!</div><div>Type `help` for help</div>';
                        return null;
                    }
                    if (args === '-t') {
                        terminal.innerHTML = '<div>Welcome to LandenOS!</div><div>Type `help` for help</div>';
                        return this.executeSingle('test');
                    }
                    if (args === '-h') {
                        return ['boot - System power management. Flags: (none) turn off, -r (reboot), -t (reboot and test), -h (help)'];
                    }
                    return [`[error] Unknown flag \`${args}\` for \`${cmd}\`!`];
                }

                // SYS
                if (cmd === 'sys') {
                    if (!args) {
                        return [
                            '--- LandenOS System Information ---',
                            `Version     : ${this.version}`,
                            `System      : ${this.sysInfo}`,
                            `System Time : ${new Date().toLocaleString()}`,
                            'State       : RUNNING (OK)'
                        ];
                    }
                    if (args === '-v') {
                        return [`LandenOS Version: ${this.version}`];
                    }
                    if (args === '-h') {
                        return ['sys - Displays system information or OS version. Flags: -v (version), -h (help)'];
                    }
                    return [`[error] Unknown flag \`${args}\` for \`${cmd}\`!`];
                }

                // LIST
                if (cmd === 'list') {
                    if (args === '-h') {
                        return ['list - Lists items in the current working directory. Flags: -r (human readable), -i (info & filesize), -t (tree view), -h (help)'];
                    }

                    const fs = FS.getFS();
                    const cwdPath = this.cwd;
                    const children = [];

                    for (const path in fs) {
                        if (path === '/') continue;
                        const parent = FS.getParentPath(path);
                        if (parent === cwdPath) {
                            const name = path.substring(path.lastIndexOf('/') + 1);
                            children.push({ name, path, ...fs[path] });
                        }
                    }

                    if (!args) {
                        if (children.length === 0) return ['[noats] Directory is empty.'];
                        return children.map(c => c.type === 'dir' ? `[DIR]  ${c.name}/` : `[FILE] ${c.name}`);
                    }

                    if (args === '-r') {
                        if (children.length === 0) return ['[noats] Directory is empty.'];
                        return children.map(c => {
                            const dateStr = new Date(c.created || Date.now()).toLocaleString();
                            const typeStr = c.type === 'dir' ? '<DIR> ' : '<FILE>';
                            return `${typeStr}  ${c.name.padEnd(20)}  Created: ${dateStr}`;
                        });
                    }

                    if (args === '-i') {
                        if (children.length === 0) return ['[noats] Directory is empty.'];
                        return children.map(c => {
                            const size = c.type === 'file' ? (c.content ? c.content.length : 0) + ' bytes' : 'N/A';
                            const typeStr = c.type.toUpperCase();
                            return `Type: ${typeStr.padEnd(5)} | Size: ${size.padEnd(10)} | Name: ${c.name}`;
                        });
                    }

                    if (args === '-t') {
                        const lines = [`Tree location: ${cwdPath}`];
                        const buildTree = (basePath, prefix) => {
                            const items = [];
                            for (const path in fs) {
                                if (path === '/') continue;
                                if (FS.getParentPath(path) === basePath) {
                                    items.push({ name: path.substring(path.lastIndexOf('/') + 1), path, ...fs[path] });
                                }
                            }
                            items.forEach((item, idx) => {
                                const isLast = idx === items.length - 1;
                                const connector = isLast ? '└── ' : '├── ';
                                const suffix = item.type === 'dir' ? '/' : '';
                                lines.push(`${prefix}${connector}${item.name}${suffix}`);
                                if (item.type === 'dir') {
                                    buildTree(item.path, prefix + (isLast ? '    ' : '│   '));
                                }
                            });
                        };
                        buildTree(cwdPath, '');
                        if (lines.length === 1) lines.push('└── (empty)');
                        return lines;
                    }

                    return [`[error] Unknown flag \`${args}\` for \`list\`!`];
                }

                // FILE
                if (cmd === 'file') {
                    if (args === '-h') {
                        return ['file - Manage or inspect files. Flags: -f (create/toggle), -e (check exists), -r (remove file/pattern), -c (create), -h (help)'];
                    }

                    let flag = '';
                    let pathArg = args;

                    if (args.startsWith('-')) {
                        const spaceIdx = args.indexOf(' ');
                        if (spaceIdx !== -1) {
                            flag = args.substring(0, spaceIdx).trim();
                            pathArg = args.substring(spaceIdx + 1).trim();
                        } else {
                            flag = args.trim();
                            pathArg = '';
                        }
                    }

                    pathArg = stripQuotes(pathArg);

                    if (!pathArg && flag !== '-h') {
                        return [`[error] Command \`file\` requires a file path argument!`];
                    }

                    // Wildcard handling for file removal (e.g. file -r `*.txt`)
                    if (flag === '-r' && pathArg.includes('*')) {
                        let targetDir = this.cwd;
                        let pattern = pathArg;

                        const lastSlash = pathArg.lastIndexOf('/');
                        if (lastSlash !== -1) {
                            const dirPart = pathArg.substring(0, lastSlash);
                            pattern = pathArg.substring(lastSlash + 1);
                            targetDir = FS.normalizePath(dirPart, this.cwd);
                        }

                        const fs = FS.getFS();
                        const removedFiles = [];

                        for (const path in fs) {
                            if (fs[path].type === 'file' && FS.getParentPath(path) === targetDir) {
                                const fileName = path.substring(path.lastIndexOf('/') + 1);
                                if (matchWildcard(fileName, pattern)) {
                                    FS.remove(path);
                                    removedFiles.push(path);
                                }
                            }
                        }

                        if (removedFiles.length === 0) {
                            return [`[warng] No files matched pattern \`${pathArg}\`!`];
                        }
                        return [`[noats] Removed ${removedFiles.length} file(s) matching \`${pathArg}\`.`];
                    }

                    const fullPath = FS.normalizePath(pathArg, this.cwd);

                    if (!flag) {
                        const node = FS.getNode(fullPath);
                        if (!node) return [`[error] File \`${fullPath}\` does not exist!`];
                        if (node.type !== 'file') return [`[error] Path \`${fullPath}\` is a directory, not a file!`];
                        
                        const filename = fullPath.substring(fullPath.lastIndexOf('/') + 1);
                        const size = node.content ? node.content.length : 0;
                        const createdStr = new Date(node.created || Date.now()).toLocaleString();
                        return [
                            `================ FILE HEADER ===============`,
                            `Name      : ${filename}`,
                            `Path      : ${fullPath}`,
                            `Type      : FILE`,
                            `Size      : ${size} bytes`,
                            `Created   : ${createdStr}`,
                            `============================================`
                        ];
                    }

                    if (flag === '-f') {
                        if (FS.exists(fullPath)) {
                            FS.remove(fullPath);
                            return [`[noats] File \`${fullPath}\` existed and was removed.`];
                        } else {
                            const ok = FS.createFile(fullPath);
                            if (!ok) return [`[error] Cannot create file \`${fullPath}\`. Parent directory missing.`];
                            return [`[noats] File \`${fullPath}\` created.`];
                        }
                    }

                    if (flag === '-e') {
                        const exists = FS.exists(fullPath) && FS.getNode(fullPath).type === 'file';
                        return [`[noats] File \`${fullPath}\` exists: ${exists}`];
                    }

                    if (flag === '-r') {
                        if (!FS.exists(fullPath)) return [`[error] File \`${fullPath}\` does not exist!`];
                        FS.remove(fullPath);
                        return [`[noats] File \`${fullPath}\` successfully removed.`];
                    }

                    if (flag === '-c') {
                        if (FS.exists(fullPath)) return [`[warng] File \`${fullPath}\` already exists!`];
                        const ok = FS.createFile(fullPath);
                        if (!ok) return [`[error] Cannot create file \`${fullPath}\`. Parent directory missing.`];
                        return [`[noats] File \`${fullPath}\` created successfully.`];
                    }

                    return [`[error] Unknown flag \`${flag}\` for \`file\`!`];
                }

                // DIR
                if (cmd === 'dir') {
                    if (args === '-h') {
                        return ['dir - Manage or inspect directories. Flags: -r (remove), -c (create), -h (help)'];
                    }

                    let flag = '';
                    let pathArg = args;

                    if (args.startsWith('-')) {
                        const spaceIdx = args.indexOf(' ');
                        if (spaceIdx !== -1) {
                            flag = args.substring(0, spaceIdx).trim();
                            pathArg = args.substring(spaceIdx + 1).trim();
                        } else {
                            flag = args.trim();
                            pathArg = '';
                        }
                    }

                    pathArg = stripQuotes(pathArg);

                    if (!pathArg) {
                        return [`[error] Command \`dir\` requires a directory path argument!`];
                    }

                    const fullPath = FS.normalizePath(pathArg, this.cwd);

                    if (!flag) {
                        const node = FS.getNode(fullPath);
                        if (!node) return [`[error] Directory \`${fullPath}\` does not exist!`];
                        if (node.type !== 'dir') return [`[error] Path \`${fullPath}\` is a file, not a directory!`];

                        const fs = FS.getFS();
                        let itemCount = 0;
                        for (const key in fs) {
                            if (key !== fullPath && FS.getParentPath(key) === fullPath) {
                                itemCount++;
                            }
                        }
                        const dirname = fullPath === '/' ? '/' : fullPath.substring(fullPath.lastIndexOf('/') + 1);
                        const createdStr = new Date(node.created || Date.now()).toLocaleString();

                        return [
                            `================ DIR HEADER ===============`,
                            `Name      : ${dirname}`,
                            `Path      : ${fullPath}`,
                            `Type      : DIRECTORY`,
                            `Items     : ${itemCount}`,
                            `Created   : ${createdStr}`,
                            `===========================================`
                        ];
                    }

                    if (flag === '-c') {
                        if (FS.exists(fullPath)) return [`[warng] Directory \`${fullPath}\` already exists!`];
                        const ok = FS.createDir(fullPath);
                        if (!ok) return [`[error] Cannot create directory \`${fullPath}\`. Parent directory missing.`];
                        return [`[noats] Directory \`${fullPath}\` created successfully.`];
                    }

                    if (flag === '-r') {
                        if (fullPath === '/') return [`[error] Cannot remove root directory \`/\`!`];
                        if (!FS.exists(fullPath)) return [`[error] Directory \`${fullPath}\` does not exist!`];
                        FS.remove(fullPath);
                        if (this.cwd.startsWith(fullPath)) {
                            this.cwd = FS.getParentPath(fullPath);
                        }
                        return [`[noats] Directory \`${fullPath}\` removed successfully.`];
                    }

                    return [`[error] Unknown flag \`${flag}\` for \`dir\`!`];
                }

                // IWF
                if (cmd === 'iwf') {
                    if (args === '-h' || !args) {
                        return ['iwf - In/Write File utility. Flags: -r `path` (read), -w `path` `content` (write), -c `path` (clear), -h (help)'];
                    }

                    let flag = '';
                    let restArgs = args;

                    if (args.startsWith('-')) {
                        const spaceIdx = args.indexOf(' ');
                        if (spaceIdx !== -1) {
                            flag = args.substring(0, spaceIdx).trim();
                            restArgs = args.substring(spaceIdx + 1).trim();
                        } else {
                            flag = args.trim();
                            restArgs = '';
                        }
                    }

                    if (flag === '-r') {
                        const pathStr = stripQuotes(restArgs);
                        if (!pathStr) return [`[error] Command \`iwf -r\` requires a file path!`];
                        const fullPath = FS.normalizePath(pathStr, this.cwd);
                        const node = FS.getNode(fullPath);
                        if (!node) return [`[error] File \`${fullPath}\` does not exist!`];
                        if (node.type !== 'file') return [`[error] \`${fullPath}\` is a directory!`];
                        return node.content ? [node.content] : ['[noats] (file is empty)'];
                    }

                    if (flag === '-w') {
                        const ticks = extractBackticks(restArgs);
                        let pathStr = '';
                        let contentStr = '';

                        if (ticks.length >= 1) {
                            pathStr = ticks[0];
                            contentStr = ticks.length > 1 ? ticks[1] : (pipedData !== null ? pipedData.join('\n') : '');
                        } else {
                            const parts = restArgs.split(' ');
                            pathStr = stripQuotes(parts[0]);
                            contentStr = parts.slice(1).join(' ');
                            if (pipedData !== null && !contentStr) {
                                contentStr = pipedData.join('\n');
                            }
                        }

                        if (!pathStr) return [`[error] Command \`iwf -w\` requires a file path!`];
                        pathStr = stripQuotes(pathStr);

                        const fullPath = FS.normalizePath(pathStr, this.cwd);
                        if (!FS.exists(fullPath)) {
                            FS.createFile(fullPath, contentStr);
                        } else {
                            FS.writeFile(fullPath, contentStr);
                        }
                        return [`[noats] Successfully wrote to \`${fullPath}\`.`];
                    }

                    if (flag === '-c') {
                        const pathStr = stripQuotes(restArgs);
                        if (!pathStr) return [`[error] Command \`iwf -c\` requires a file path!`];
                        const fullPath = FS.normalizePath(pathStr, this.cwd);
                        if (!FS.exists(fullPath)) return [`[error] File \`${fullPath}\` does not exist!`];
                        FS.writeFile(fullPath, '');
                        return [`[noats] Cleared content of \`${fullPath}\`.`];
                    }

                    return [`[error] Unknown flag \`${flag}\` for \`iwf\`!`];
                }

                // MV
                if (cmd === 'mv') {
                    if (args === '-h' || !args) {
                        return ['mv - Move, copy, paste, or duplicate files. Usage: mv `src` `dest` | mv -c `path` | mv -p `path` | mv -d `src` `dest`'];
                    }

                    let flag = '';
                    let restArgs = args;

                    if (args.startsWith('-')) {
                        const spaceIdx = args.indexOf(' ');
                        if (spaceIdx !== -1) {
                            flag = args.substring(0, spaceIdx).trim();
                            restArgs = args.substring(spaceIdx + 1).trim();
                        } else {
                            flag = args.trim();
                            restArgs = '';
                        }
                    }

                    const pathArgs = extractPathArgs(restArgs);

                    // Copy file to clipboard: mv -c `path/test.txt`
                    if (flag === '-c') {
                        const srcPath = pathArgs[0];
                        if (!srcPath) return [`[error] Command \`mv -c\` requires a source file path!`];
                        
                        const fullSrc = FS.normalizePath(srcPath, this.cwd);
                        const node = FS.getNode(fullSrc);
                        if (!node) return [`[error] File \`${fullSrc}\` does not exist!`];
                        if (node.type !== 'file') return [`[error] \`${fullSrc}\` is a directory, not a file!`];

                        const fileName = fullSrc.substring(fullSrc.lastIndexOf('/') + 1);
                        this.clipboard = {
                            name: fileName,
                            content: node.content || ''
                        };

                        return [`[noats] Copied \`${fullSrc}\` to clipboard.`];
                    }

                    // Paste file from clipboard: mv -p `test.txt`
                    if (flag === '-p') {
                        if (!this.clipboard) {
                            return [`[error] Clipboard is empty! Use \`mv -c\` first.`];
                        }
                        const destPath = pathArgs[0] || this.clipboard.name;
                        const fullDest = FS.normalizePath(destPath, this.cwd);

                        if (!FS.exists(fullDest)) {
                            const created = FS.createFile(fullDest, this.clipboard.content);
                            if (!created) return [`[error] Cannot paste to \`${fullDest}\`. Directory missing.`];
                        } else {
                            FS.writeFile(fullDest, this.clipboard.content);
                        }

                        return [`[noats] Pasted file contents to \`${fullDest}\`.`];
                    }

                    // Duplicate file: mv -d `path/test.txt` `test.txt`
                    if (flag === '-d') {
                        if (pathArgs.length < 2) {
                            return [`[error] Command \`mv -d\` requires both source and destination paths!`];
                        }
                        const fullSrc = FS.normalizePath(pathArgs[0], this.cwd);
                        const fullDest = FS.normalizePath(pathArgs[1], this.cwd);

                        const node = FS.getNode(fullSrc);
                        if (!node) return [`[error] Source file \`${fullSrc}\` does not exist!`];
                        if (node.type !== 'file') return [`[error] \`${fullSrc}\` is a directory!`];

                        if (!FS.exists(fullDest)) {
                            const created = FS.createFile(fullDest, node.content || '');
                            if (!created) return [`[error] Cannot duplicate to \`${fullDest}\`. Directory missing.`];
                        } else {
                            FS.writeFile(fullDest, node.content || '');
                        }

                        return [`[noats] Duplicated \`${fullSrc}\` to \`${fullDest}\`.`];
                    }

                    // Standard Move: mv `path/test.txt` `test.txt`
                    if (!flag) {
                        if (pathArgs.length < 2) {
                            return [`[error] Command \`mv\` requires both source and destination paths!`];
                        }
                        const fullSrc = FS.normalizePath(pathArgs[0], this.cwd);
                        const fullDest = FS.normalizePath(pathArgs[1], this.cwd);

                        const node = FS.getNode(fullSrc);
                        if (!node) return [`[error] File \`${fullSrc}\` does not exist!`];
                        if (node.type !== 'file') return [`[error] \`${fullSrc}\` is a directory!`];

                        if (!FS.exists(fullDest)) {
                            const created = FS.createFile(fullDest, node.content || '');
                            if (!created) return [`[error] Cannot move to \`${fullDest}\`. Directory missing.`];
                        } else {
                            FS.writeFile(fullDest, node.content || '');
                        }

                        FS.remove(fullSrc);
                        return [`[noats] Moved \`${fullSrc}\` to \`${fullDest}\`.`];
                    }

                    return [`[error] Unknown flag \`${flag}\` for \`mv\`!`];
                }

                // CD
                if (cmd === 'cd') {
                    if (args === '-h') {
                        return ['cd - Change directory. Usage: cd `path` or cd . (goes back up). Flags: -h'];
                    }
                    if (!args) {
                        this.cwd = '/';
                        return [];
                    }

                    let targetPath = stripQuotes(args);

                    if (targetPath === '.') {
                        this.cwd = FS.getParentPath(this.cwd);
                        return [];
                    }

                    const fullPath = FS.normalizePath(targetPath, this.cwd);
                    const node = FS.getNode(fullPath);

                    if (!node) {
                        return [`[error] Directory \`${fullPath}\` does not exist!`];
                    }
                    if (node.type !== 'dir') {
                        return [`[error] \`${fullPath}\` is not a directory!`];
                    }

                    this.cwd = fullPath;
                    return [];
                }

                return [`[error] \`${cmd}\` is not a command! Type \`help\` for a list of commands.`];
            },

            executePipeline(pipelineStr) {
                const pipeCmds = [];
                let current = '';
                let inBacktick = false;

                for (let i = 0; i < pipelineStr.length; i++) {
                    const char = pipelineStr[i];
                    if (char === '`') {
                        inBacktick = !inBacktick;
                        current += char;
                    } else if (!inBacktick && char === '|') {
                        pipeCmds.push(current);
                        current = '';
                    } else {
                        current += char;
                    }
                }
                pipeCmds.push(current);

                let currentOutput = null;

                for (const cmdStr of pipeCmds) {
                    if (!cmdStr.trim()) continue;
                    currentOutput = this.executeSingle(cmdStr, currentOutput);
                    if (currentOutput === null) {
                        break;
                    }
                    if (currentOutput.length > 0 && typeof currentOutput[0] === 'string' && currentOutput[0].startsWith('[error]')) {
                        break;
                    }
                }

                return currentOutput;
            },

            execute(input) {
                if (!this.isPoweredOn) return null;

                let checkBacktick = false;
                for (let i = 0; i < input.length - 1; i++) {
                    const char = input[i];
                    if (char === '`') {
                        checkBacktick = !checkBacktick;
                    } else if (!checkBacktick) {
                        const nextChar = input[i + 1];
                        if (char === nextChar && /[^\w\s`]/.test(char)) {
                            if (char !== '&') {
                                const badOp = char + nextChar;
                                return [`[error] Unsupported command operator \`${badOp}\`! Use \`&&\` to chain commands.`];
                            }
                        }
                    }
                }

                const rawCommands = [];
                let current = '';
                let inBacktick = false;

                for (let i = 0; i < input.length; i++) {
                    const char = input[i];
                    if (char === '`') {
                        inBacktick = !inBacktick;
                        current += char;
                    } else if (!inBacktick && char === '&' && input[i + 1] === '&') {
                        rawCommands.push(current);
                        current = '';
                        i++;
                    } else {
                        current += char;
                    }
                }
                rawCommands.push(current);

                let combinedOutput = [];
                let isCleared = false;

                for (const cmdStr of rawCommands) {
                    if (!cmdStr.trim()) continue;
                    const output = this.executePipeline(cmdStr);
                    if (output === null) {
                        combinedOutput = [];
                        isCleared = true;
                    } else {
                        combinedOutput.push(...output);
                    }
                }

                if (isCleared && combinedOutput.length === 0) {
                    return null;
                }
                return combinedOutput;
            }
        };

        function scrollToBottom() {
            terminal.scrollTop = terminal.scrollHeight;
        }

        window.addEventListener('wheel', (e) => e.preventDefault(), { passive: false });
        window.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        window.addEventListener('click', () => {
            if (!document.pointerLockElement && OS.isPoweredOn) {
                document.body.requestPointerLock();
            }
        });

        window.addEventListener('keydown', (e) => {
            if (!OS.isPoweredOn) return;

            if (document.pointerLockElement === document.body) {
                if (e.key === 'Escape') {
                    document.exitPointerLock();
                    return;
                }

                e.preventDefault();
                e.stopPropagation();

                const activeLine = terminal.lastElementChild;
                if (!activeLine || !activeLine.classList.contains('line')) return;

                const inputSpan = activeLine.querySelector('.input');
                const cursor = activeLine.querySelector('.cursor');

                if (e.key === 'Enter') {
                    if (cursor) cursor.remove();
                    
                    const output = OS.execute(buffer);
                    if (output !== null && OS.isPoweredOn) {
                        output.forEach(text => {
                            const line = createLineElement(text);
                            terminal.appendChild(line);
                        });
                    }

                    if (OS.isPoweredOn) {
                        const nextLine = document.createElement('div');
                        nextLine.className = 'line';
                        nextLine.innerHTML = `&gt;&gt;&gt; [user @ ${OS.cwd}] $ <span class="input"></span><span class="cursor"></span>`;
                        terminal.appendChild(nextLine);
                    }

                    buffer = '';
                    scrollToBottom();
                } else if (e.key === 'Backspace') {
                    buffer = buffer.slice(0, -1);
                    if (inputSpan) inputSpan.textContent = buffer;
                    scrollToBottom();
                } else if (e.key.length === 1) {
                    if (buffer.length < MAX_INPUT) {
                        buffer += e.key;
                        if (inputSpan) inputSpan.textContent = buffer;
                        scrollToBottom();
                    }
                }
            }
        }, true);
    </script>
</body>
</html>
